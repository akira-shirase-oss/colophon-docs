# What every change to the docs must pass, and what runs each night against colophon-cms main:
#
#   build      the site builds; every internal link resolves (starlight-links-validator fails the
#              build); the search index, llms.txt, each page's Markdown copy, the changelog feed and
#              the API reference are in the output; no private names or paths are in it.
#   links      every external link in the built site answers.
#   privacy    the built site contacts no other host; the API reference's Test Request goes only to
#              the server it is given and keeps no token after a reload.
#   openapi    the API reference's copy of the OpenAPI document is byte-identical to colophon-cms main.
#   snippets   Colophon is built from colophon-cms main and started with the quick start's own
#              commands; then every command on the quick start and API pages runs, in order, and
#              its output must match what the page shows (ids, times and secrets normalised).
name: ci

on:
  push:
    branches: [main, 'docs/**'] # docs/** so a branch is checked before review
  pull_request:
  schedule:
    - cron: '17 4 * * *' # nightly: catch colophon-cms main moving under the docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (links, search, llms.txt, Markdown copies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build, validate internal links, check the output
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7

  links:
    name: external links
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 20
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^https://docs\.colophon\.404human\.dev'
            --exclude '^https://github\.com/akira-shirase-oss/colophon-docs/(edit|issues/new)'
            --exclude '^https://cms\.example\.com'
            --exclude '^https://s3\.example\.com'
            --exclude '^https://db\.example\.com'
            --root-dir ${{ github.workspace }}/dist
            'dist/**/*.html'
          fail: true

  privacy:
    name: privacy (no third-party hosts; try-it goes only to the configured server; no token kept)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - name: Serve the built site and check every request it makes
        run: |
          npx astro preview --port 4321 --host 127.0.0.1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:4321/ && break; sleep 1; done
          node scripts/check-privacy.mjs --base http://127.0.0.1:4321

  openapi:
    name: OpenAPI copy matches colophon-cms main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/sync-openapi.mjs --check

  snippets:
    name: examples run against colophon-cms main
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The steps the pages run, in order
        run: node scripts/snippets.mjs --list
      - name: Install Colophon as the quick start says, then run every example
        run: node scripts/snippets.mjs
      - name: Colophon's logs, if anything failed
        if: failure()
        working-directory: .snippets/work/colophon-cms/deploy/quickstart
        run: docker compose logs --no-color --tail 200 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snippets
          path: .snippets/run/
          if-no-files-found: ignore
          retention-days: 7
